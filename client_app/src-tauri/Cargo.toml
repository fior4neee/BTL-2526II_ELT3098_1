[package]
name = "vnu-leo-client-app"
version = "0.1.0"
description = "VNU-LEO end-user router desktop client"
authors = ["VNU-LEO Client Team"]
edition = "2021"

[lib]
name = "vnu_leo_client_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
